services:
  - type: web
    name: sewasetu-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 60 app.app:app
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sewasetu-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: sewasetu-db
    databaseName: sewasetu
    user: sewasetu
    plan: starter
