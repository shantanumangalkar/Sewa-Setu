{% extends "base.html" %}
{% block content %}
<h2>Application Status Portal</h2>
<form method="post">
  <label>Mobile Number</label>
  <input type="text" name="mobile" maxlength="10">
  <label>Password</label>
  <input type="password" name="password" placeholder="DDMMYYYY (Your Date of Birth)">
  <p class="note" style="margin:4px 0 12px;color:#0b3d6e;">
    <strong>Default Password:</strong> Your <strong>Date of Birth</strong> in <strong>DDMMYYYY</strong> format.<br>
    <em>Example: If born on 15 August 1958, enter <code>15081958</code></em>
  </p>
  <p><button class="btn" type="submit">Login</button></p>
</form>
<p class="note"><a href="/status/reset">Forgot password?</a></p>
{% endblock %}
